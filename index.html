<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizz entre amis</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <main id="app"><p class="loading">Chargement…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ce site a besoin de JavaScript.</noscript>
  <script>
    window.setTimeout(() => {
      const app = document.getElementById("app");
      if (app?.querySelector(".loading")) {
        app.innerHTML = `<section style="max-width:560px;margin:12vh auto;padding:24px;background:#17142b;color:#f8f7ff;border:3px solid #53ff9a;font:18px/1.6 monospace">
          <h1 style="color:#53ff9a">Oups, le jeu ne démarre pas</h1>
          <p>Vérifie que GitHub Pages a bien publié le dossier du site : index.html doit être à la racine, avec les dossiers css et js à côté.</p>
          <p>Recharge la page. Si le message revient, vérifie aussi que le domaine du site est autorisé dans Firebase Authentication.</p>
        </section>`;
      }
    }, 12000);
  </script>
  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
