<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e1d">
  <title>Quizz entre amis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <main id="app"><p class="loading">Chargement…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ce site a besoin de JavaScript.</noscript>
  <script>
    window.setTimeout(() => {
      const app = document.getElementById("app");
      if (app?.querySelector(".loading")) {
        app.innerHTML = `<section class="card narrow">
          <h2>Oups, le jeu ne démarre pas</h2>
          <p>Vérifie que GitHub Pages a bien publié le dossier du site : index.html doit être à la racine, avec les dossiers css et js à côté.</p>
          <p>Recharge la page. Si le message revient, vérifie aussi que le domaine du site est autorisé dans Firebase Authentication.</p>
        </section>`;
      }
    }, 12000);
  </script>
  <script type="module" src="js/app.js?v=12"></script>
</body>
</html>
